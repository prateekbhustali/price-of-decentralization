ALGORITHM: VDN_PS
SINGLE_AGENT: False

ENV_CONFIG:
    env_name: matrix_game
    env_setting: climb_game
    kwargs: 
        time_limit: 25
    inference_env_kwargs:
        time_limit: 25

SEED: 42
DETERMINISTIC: True # deterministic operations are often slower than nondeterministic operations, but ensure reproducibility.
NUM_TRAIN_EPISODES: 100_000
MAX_MEMORY_SIZE: 20_000
BATCH_SIZE: 64
TARGET_NETWORK_RESET: 100
DISCOUNT_FACTOR: 0.8

NETWORK_CONFIG:
    hidden_layers: [64, 64]
    optimizer: Adam
    lr: 0.001
    lr_scheduler:
        scheduler: LinearLR
        kwargs:
            start_factor: 1
            end_factor: 0.1
            total_iters: 10_000

EXPLORATION_STRATEGY:
    name: epsilon_greedy
    max_value: 1
    min_value: 0.005
    num_episodes: 10_000

LOGGING_INTERVAL: 100 # episodes
EVAL_INTERVAL: 5_000 # episodes
NUM_INFERENCE_EPISODES: 10_000 # episodes
CHECKPOINT_INTERVAL: 5_000 # episodes
CHECKPOINT_DIR: ./checkpoints/

WANDB:
    project: price_of_decentralization
    # entity:  # default entity
    # dir: # wandb dir location
    mode: online
